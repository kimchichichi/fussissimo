  <section class="section">
    <div class="galerie">
      <img class="group" src="image/fussissimo.webp" alt="Trio Fussissimo" data-full="image/fussissimo.webp" />
      <img src="image/colorRehan.webp" alt="Rehan Syed" data-full="image/colorRehan.webp" />
      <img src="image/colorHarald.webp" alt="Harald Oeler" data-full="image/colorHarald.webp" />
      <img src="image/colorSimon.webp" alt="Simon Ort" data-full="image/colorSimon.webp" />
      <img src="image/Rehan.webp" alt="Rehan Syed" data-full="image/Rehan.webp" />
      <img src="image/Harald.webp" alt="Harald Oeler" data-full="image/Harald.webp" />
      <img src="image/Simon.webp" alt="Simon Ort" data-full="image/Simon.webp" />
    </div>
  </section>

  <div id="myModal" class="modal" role="dialog" aria-modal="true" aria-label="Bildansicht">
    <button type="button" class="close" aria-label="Schließen"><i data-lucide="x"></i></button>
    <div class="modal-content"><img id="modalImage" alt="" /></div>
    <div class="modal-nav">
      <button type="button" class="btn btn-with-icon" id="prevBtn"><i data-lucide="chevron-left"></i><span>Zurück</span></button>
      <button type="button" class="btn btn-with-icon" id="nextBtn"><span>Weiter</span><i data-lucide="chevron-right"></i></button>
    </div>
  </div>



  <script>
    const modal = document.getElementById("myModal");
    const modalImg = document.getElementById("modalImage");
    const images = Array.from(document.querySelectorAll(".galerie img"));
    let currentIndex = 0;
    let touchX = null;

    function openModal(index) {
      currentIndex = index;
      modalImg.src = images[currentIndex].dataset.full;
      modalImg.alt = images[currentIndex].alt;
      modal.classList.add("open");
    }
    function closeModal() {
      modal.classList.remove("open");
      modalImg.removeAttribute("src");
      modalImg.alt = "";
    }

    images.forEach((img, i) => img.addEventListener("click", () => openModal(i)));
    document.querySelector(".close").addEventListener("click", closeModal);
    document.getElementById("prevBtn").addEventListener("click", () =>
      openModal((currentIndex - 1 + images.length) % images.length)
    );
    document.getElementById("nextBtn").addEventListener("click", () =>
      openModal((currentIndex + 1) % images.length)
    );
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", (e) => {
      if (!modal.classList.contains("open")) return;
      if (e.key === "Escape") closeModal();
      if (e.key === "ArrowLeft") openModal((currentIndex - 1 + images.length) % images.length);
      if (e.key === "ArrowRight") openModal((currentIndex + 1) % images.length);
    });
    modal.addEventListener("touchstart", (e) => { touchX = e.changedTouches[0].screenX; }, { passive: true });
    modal.addEventListener("touchend", (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].screenX - touchX;
      if (Math.abs(dx) > 50) {
        if (dx > 0) openModal((currentIndex - 1 + images.length) % images.length);
        else openModal((currentIndex + 1) % images.length);
      }
      touchX = null;
    }, { passive: true });
  </script>
